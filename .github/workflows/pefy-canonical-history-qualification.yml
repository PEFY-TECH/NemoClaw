name: PEFY Canonical History Qualification

on:
  pull_request:
    branches:
      - qualification/upstream-base-2026-08-25
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-upgrade-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nemoclaw/package-lock.json
      - name: Fetch verified canonical NVIDIA history
        run: |
          set -euo pipefail
          git remote remove canonical 2>/dev/null || true
          git remote add canonical https://github.com/NVIDIA/NemoClaw.git
          for tag in v0.0.36 v0.0.55 v0.0.74 v0.0.89; do
            git fetch --no-write-fetch-head canonical "refs/tags/${tag}:refs/tags/${tag}"
          done
          test "$(git rev-parse 'v0.0.36^{commit}')" = "3351fbdd4eb7d9b80ec471545083956327da2b10"
          test "$(git rev-parse 'v0.0.55^{commit}')" = "95d483fe2b6569d68e59493c60f19df09a068e8f"
          test "$(git rev-parse 'v0.0.74^{commit}')" = "3a05b54e8ec3e1d5550ec5c728de54af872bffe3"
          test "$(git rev-parse 'v0.0.89^{commit}')" = "1143aa5cce77f3bad1b3b5588bd7fddbe438237e"
          echo "Canonical historical commits verified."
      - name: Install pinned Pi search tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fd-find=9.0.0-1 ripgrep=14.1.0-1
      - name: Install dependencies
        run: bash .github/actions/ci-install-dependencies.sh
      - name: Build plugin and CLI
        run: |
          cd nemoclaw && npm run build && cd ..
          npm run build:cli
      - name: Run canonical-history dependent shard 12
        run: |
          npx vitest run --project cli --project integration --project e2e-support \
            --shard=12/12 \
            --reporter=github-actions
